name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - name: Parse QML
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          find . -name '*.qml' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            /usr/lib/qt6/bin/qmlformat "$file" > /dev/null
          done
      - name: Check whitespace and shell scripts
        run: |
          git diff-tree --check --root HEAD
          bash -n install tests/check-drag tools/render-preview
